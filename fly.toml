# fly.toml app configuration file generated for gplaypromocodeprovider on 2026-11-03T23:21:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gplaypromocodeprovider'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  COOKIE_SECURE = 'true'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
