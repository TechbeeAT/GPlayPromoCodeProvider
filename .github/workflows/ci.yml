# CI: builds and tests every pull request and every push to main. See README.md ("CI").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" button on the Actions tab: tests, builds and (on main) publishes without a new commit.
  workflow_dispatch:

# A newer push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Java 21 for the Gradle daemon and the server (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's downloads and build outputs between runs.
      - uses: gradle/actions/setup-gradle@v5

      # The browser tests use the runner's preinstalled Chrome.
      - name: Run all tests
        run: ./gradlew --console=plain :shared:jsTest :shared:wasmJsTest :shared:jvmTest :api:jvmTest :server:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds the image like Fly.io will, but doesn't push it anywhere. Layers are cached in
      # GitHub's cache, so unchanged steps (base images, apt packages) are fast.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes the image of main to GitHub's container registry, after the tests and the image build
  # passed. Every Fly.io instance, the owner's too, deploys that image (fly.toml names it); nothing
  # is built on Fly.io, whose builders run out of memory compiling the web app. Forks don't publish.
  publish:
    name: Publish Docker image
    needs: [test, docker]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && github.repository == 'TechbeeAT/GPlayPromoCodeProvider'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The run's own GitHub token may push to the repository's packages: no secret to set up.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same build as the "Build Docker image" job; its cached layers make this quick. Tagged
      # "latest" (what fly.toml deploys) and with the commit (to deploy or go back to a fixed version).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/techbeeat/gplaypromocodeprovider:latest
            ghcr.io/techbeeat/gplaypromocodeprovider:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/TechbeeAT/GPlayPromoCodeProvider
          cache-from: type=gha
